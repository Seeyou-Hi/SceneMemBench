[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scenemembench"
version = "0.1.0.dev0"
description = "Standalone scene-memory continuation and evaluation tools"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=9", "opencv-python-headless>=4.8", "scikit-image>=0.21", "imageio>=2.31", "imageio-ffmpeg>=0.4", "PyYAML>=6"]

[project.optional-dependencies]
metrics = ["torch>=2.2", "torchvision", "transformers>=4.40", "lpips>=0.1.4"]
native = ["torch>=2.2", "torchvision", "diffusers", "transformers", "accelerate", "safetensors", "einops", "omegaconf", "easydict", "tqdm", "ftfy", "sentencepiece"]
test = ["pytest>=7"]

[project.scripts]
scenemembench = "scenemembench.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scenemembench = ["**/*.yaml", "**/*.json", "**/*.txt", "**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
