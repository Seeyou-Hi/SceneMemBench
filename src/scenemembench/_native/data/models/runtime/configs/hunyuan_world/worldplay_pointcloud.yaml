schema_version: worldfoundry-hunyuan-world-runtime-config-v1
runtime: hunyuan_worldplay_pointcloud
description: HY-WorldPlay with point-cloud memory retrieval enabled.
defaults:
  model_path: ${SCENEMEMBENCH_CKPT_DIR}/HY-WorldPlay
  video_model_path: ${SCENEMEMBENCH_CKPT_DIR}/HunyuanVideo-1.5
  mode: 480p_i2v
  device: cuda
  create_sr_pipeline: false
  force_sparse_attn: false
  transformer_dtype: bfloat16
  enable_offloading: true
  enable_group_offloading:
  overlap_group_offloading: true
  init_infer_state: true
  infer_state_kwargs:
    sage_blocks_range: 0-53
    use_sageattn: false
    enable_torch_compile: false
    use_fp8_gemm: false
    quant_type: fp8-per-block
    include_patterns: double_blocks
    use_vae_parallel: false
  operator:
    forward_speed: 0.16
    yaw_speed_deg: 6.0
    pitch_speed_deg: 6.0
  point_cloud_retrieval:
    retrieval_unit: latent
    latents_per_query: 4
    ablation: fused_coverage
    ucm_warp_rope_enabled: true
    # Keep every selected source slot, but soften only spatial source KV
    # control during rotation. Set to official for unmodified cache attention.
    cache_policy: rotation_following
    rotation_action_conditioning_scale: 1.0
    rotation_query_pose_scale: 1.0
    anchor_attention_mass_budget: 1.0
    temporal_attention_mass_budget: 12.0
    temporal_attention_decay: 1.0
    spatial_min_attention_weight: 0.05
    spatial_attention_gamma: 1.0
    spatial_attention_mass_budget: 1.0
    initial_chunks: 1
    temporal_chunks: 3
    spatial_chunks: 2
